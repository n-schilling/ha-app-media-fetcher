configuration:
  token:
    name: API-Token
    description: Optional. Home Assistant braucht kein Token, solange „Home Assistant vertrauen“ an ist. Setze eines für andere Clients, etwa andere Apps oder, bei gemapptem Port, Programme im eigenen Netz; leer antwortet die API nur Home Assistant.
  trust_home_assistant:
    name: Home Assistant vertrauen
    description: Anfragen von der Adresse von Home Assistant im App-Netz (172.30.32.1) brauchen kein Token. Diese Adresse nutzen auch Apps im Host-Netz. Aus braucht auch Home Assistant das Token wie jeder andere Client.
  max_jobs:
    name: Gleichzeitige Aufträge
    description: Wie viele Aufträge gleichzeitig laufen; weitere Anfragen bekommen „busy“, bis einer fertig ist.
  keep_minutes:
    name: Fertige Aufträge behalten
    description: Minuten, die ein fertiger Auftrag und seine Datei abrufbar bleiben, bevor sie gelöscht werden.
  max_size_mb:
    name: Größte Datei
    description: Megabyte, die eine geholte Datei haben darf; eine größere scheitert mit „too_large“. Aufträge stoppen außerdem, solange auf der Datenpartition von Home Assistant weniger als 1 GiB frei ist.
  allow_any_site:
    name: Beliebige Seiten erlauben
    description: Auch den generischen Extractor von yt-dlp nutzen, der Medien von jeder öffentlichen Seite zu holen versucht. Aus werden nur Seiten geholt, für die yt-dlp einen Extractor hat. Links auf Adressen im eigenen Netz werden so oder so abgewiesen.
  log_level:
    name: Protokollstufe
    description: "Wie viel die App protokolliert: debug (mit jeder yt-dlp-Meldung), info, warning oder error."
network:
  8099/tcp: Die API auf dem Host, für Clients außerhalb des App-Netzes von Home Assistant (optional)
