configuration:
  token:
    name: API token
    description: Optional. Home Assistant needs no token while "Trust Home Assistant" is on. Set one for other clients, such as other apps or, with the port mapped, programs in your network; empty, the API answers Home Assistant alone.
  trust_home_assistant:
    name: Trust Home Assistant
    description: Requests from Home Assistant's address in the app network (172.30.32.1) need no token. That address is also used by apps in the host network. Off, Home Assistant needs the token like every other client.
  max_jobs:
    name: Concurrent jobs
    description: How many fetch jobs run at the same time; further requests get "busy" until one finishes.
  keep_minutes:
    name: Keep finished jobs
    description: Minutes a finished job and its file stay available before they are deleted.
  max_size_mb:
    name: Largest file
    description: Megabytes a fetched file may have; a larger one fails with "too_large". Jobs also stop while less than 1 GiB is free on Home Assistant's data partition.
  allow_any_site:
    name: Allow any site
    description: Also use yt-dlp's generic extractor, which tries to fetch media from any public site. Off, only sites yt-dlp has an extractor for are fetched. Links to addresses in your own network are refused either way.
  log_level:
    name: Log level
    description: "How much the app writes to its log: debug (with every yt-dlp message), info, warning or error."
network:
  8099/tcp: The API on the host, for clients outside Home Assistant's app network (optional)
