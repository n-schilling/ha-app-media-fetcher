name: Media Fetcher
version: "0.1.0"
slug: media_fetcher
description: Fetches audio or video from links that yt-dlp understands, with a JavaScript runtime and ffmpeg, as a small HTTP service for integrations and automations
url: https://github.com/n-schilling/ha-app-media-fetcher
arch:
  - aarch64
  - amd64
startup: services
init: false
hassio_api: true
hassio_role: default
discovery:
  - media_fetcher
ingress: true
ingress_port: 8099
panel_icon: mdi:download-box
panel_title: Media Fetcher
ports:
  8099/tcp: null
ports_description:
  8099/tcp: The API on the host, for clients outside Home Assistant's app network (optional)
watchdog: http://[HOST]:[PORT:8099]/api/v1/health
backup_exclude:
  - jobs/**
options:
  token: ""
  max_jobs: 2
  keep_minutes: 60
  allow_any_site: false
  log_level: info
schema:
  token: password?
  max_jobs: int(1,8)
  keep_minutes: int(1,1440)
  allow_any_site: bool
  log_level: list(debug|info|warning|error)
