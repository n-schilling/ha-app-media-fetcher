name: CI
# scripts/check.sh runs the same checks locally; keep the two in step.

# Not on main: a commit reaches main only after CI passed for it on dev, and
# the release workflow checks that before it tags (ci-passed.sh)
on:
  push:
    branches: [dev]
  pull_request:
  schedule:
    # Weekly, so a new base image, yt-dlp or linter release that breaks the
    # app shows up between changes
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: App configuration
        uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: ./media_fetcher
      - name: Changelog has the version
        run: .github/scripts/changelog-section.sh media_fetcher/CHANGELOG.md "$(yq -r '.version' media_fetcher/config.yaml)" > /dev/null
      - name: Shell scripts
        run: >-
          shellcheck --shell=bash --severity=warning
          media_fetcher/rootfs/etc/s6-overlay/s6-rc.d/fetcher/run
          media_fetcher/rootfs/etc/s6-overlay/s6-rc.d/fetcher/finish
          scripts/check.sh
          .github/scripts/changelog-section.sh
          tests/apparmor.sh

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # 3.13 is Debian trixie's Python, the one in the image; 3.14 the
          # current one. The last one listed is the default python.
          python-version: |
            3.13
            3.14
      - name: Install
        run: |
          for py in python3.13 python3.14; do
            "$py" -m venv ".venv-$py"
            ".venv-$py/bin/pip" install --require-hashes -r media_fetcher/requirements.txt
            ".venv-$py/bin/pip" install -r requirements_test.txt
          done
      - name: Ruff
        run: .venv-python3.14/bin/ruff check media_fetcher/rootfs/usr/lib/media_fetcher tests scripts
      - name: Test (Python 3.13, the image's)
        run: .venv-python3.13/bin/pytest -v --cov=media_fetcher --cov-report=term-missing --cov-fail-under=85
      - name: Test (Python 3.14)
        run: .venv-python3.14/bin/pytest -q

  image:
    name: Build and start (${{ matrix.arch }})
    # Each architecture on a runner of its own kind, no emulation: the image
    # is built and tested natively (the arm64 runners are free for public
    # repositories)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          version=$(yq -r '.version' media_fetcher/config.yaml)
          docker build --build-arg "BUILD_VERSION=${version}" -t media-fetcher:test media_fetcher
      - name: Image architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          arch=$(docker image inspect --format '{{.Architecture}}' media-fetcher:test)
          echo "image: ${arch}"
          [[ "${ARCH}/${arch}" == amd64/amd64 || "${ARCH}/${arch}" == aarch64/arm64 ]]
      - name: yt-dlp finds Deno and ffmpeg
        # The debug header names the JavaScript runtime and ffmpeg; without a
        # URL yt-dlp then exits with an error, which is fine here
        run: |
          out=$(docker run --rm --network none \
            --entrypoint yt-dlp media-fetcher:test -v 2>&1 || true)
          echo "${out}"
          grep -q 'JS runtimes: deno-' <<< "${out}"
          grep -q 'exe versions: ffmpeg' <<< "${out}"
      - name: Start without options
        # The service loads as its own user, as the s6 service starts it, finds
        # no options and says so
        run: |
          out=$(docker run --rm --network none --user fetcher -e PYTHONPATH=/usr/lib \
            --entrypoint python3 media-fetcher:test -m media_fetcher 2>&1 || true)
          echo "${out}"
          grep -q '/data/options.json not readable' <<< "${out}"
      - name: AppArmor profile
        # The runner's kernel enforces AppArmor like Home Assistant OS: the
        # whole app starts under the profile, and ffmpeg, ffprobe and Deno
        # run in the child profile without network. Both legs run natively,
        # so the kernel sees the programs themselves on each architecture.
        run: |
          sudo apparmor_parser -r -W media_fetcher/apparmor.txt
          tests/apparmor.sh media-fetcher:test || { sudo dmesg | grep -i apparmor | tail -n 20; exit 1; }
